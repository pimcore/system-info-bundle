name: "Composer Tests centralised"

on:
    schedule:
      - cron: '0 3 * * 1,3,5'
    workflow_dispatch:
    push:
    pull_request:
      types: [ opened, synchronize, reopened ]

env:
  PIMCORE_PROJECT_ROOT: ${{ github.workspace }}

jobs:
  test-composer:
    uses: pimcore/workflows-collection-public/.github/workflows/reusable-composer-test.yml@main
