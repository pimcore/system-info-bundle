name: "Composer Tests centralised"

on:
    schedule:
      - cron: '0 3 * * 1,3,5'
    workflow_dispatch:
    push:
        branches:
          - "[0-9]+.[0-9]+"
          - "[0-9]+.x"
    pull_request:
      types: [ opened, synchronize, reopened ]

env:
  PIMCORE_PROJECT_ROOT: ${{ github.workspace }}

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

jobs:
  test-composer:
    uses: pimcore/workflows-collection-public/.github/workflows/reusable-composer-test.yml@main
